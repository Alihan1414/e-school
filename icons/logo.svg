<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#070D18" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="30%" stop-color="#00F5D4" />
      <stop offset="70%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="emeraldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base (Rounded Rect) -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Outer Glow Border Ring -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#borderGrad)" stroke-width="4" stroke-opacity="0.8" />
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="8 6" />

  <!-- Geometric Tech Pattern in BG -->
  <g opacity="0.12" stroke="#38BDF8" stroke-width="1.5">
    <circle cx="256" cy="256" r="180" fill="none" />
    <circle cx="256" cy="256" r="130" fill="none" stroke-dasharray="4 8" />
    <path d="M256 60 L256 452 M60 256 L452 256" />
    <path d="M120 120 L392 392 M120 392 L392 120" stroke-dasharray="3 6" />
  </g>

  <!-- Main Heraldic Corporate Shield -->
  <g filter="url(#softShadow)">
    <path d="M256 75
             C350 75, 400 95, 400 160
             C400 290, 340 375, 256 425
             C172 375, 112 290, 112 160
             C112 95, 162 75, 256 75 Z"
          fill="url(#shieldGrad)"
          stroke="url(#borderGrad)"
          stroke-width="5" />
  </g>

  <!-- Inner Shield Glow Accent -->
  <path d="M256 90
           C338 90, 384 108, 384 165
           C384 280, 330 355, 256 405
           C182 355, 128 280, 128 165
           C128 108, 174 90, 256 90 Z"
        fill="none"
        stroke="#10B981"
        stroke-width="1.5"
        stroke-opacity="0.5" />

  <!-- ACADEMIC MORTARBOARD (TOP EMBLEM) -->
  <g transform="translate(256, 155) scale(0.95)">
    <!-- Cap Diamond -->
    <polygon points="0,-42 95,-7 0,28 -95,-7" fill="url(#emeraldGold)" filter="url(#neonGlow)" />
    <!-- Cap Rim/Skull -->
    <path d="M-55,10 C-55,32 55,32 55,10 L50,2 C40,24 -40,24 -50,2 Z" fill="#065F46" />
    <!-- Cap Highlight Edge -->
    <polygon points="0,-42 95,-7 0,-2 -95,-7" fill="#6EE7B7" opacity="0.6" />
    <!-- Tassel String & Pendant -->
    <path d="M0,-7 Q60,-2 65,30 Q68,48 64,62" fill="none" stroke="url(#goldAccent)" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="0" cy="-7" r="5" fill="#FDE047" />
    <rect x="58" y="60" width="12" height="18" rx="3" fill="url(#goldAccent)" />
  </g>

  <!-- CORPORATE 'E' + OPEN DIGITAL BOOK SYMBOL -->
  <g transform="translate(256, 280)">
    <!-- Left Wing / Open Book Left Page -->
    <path d="M-8,-25 C-45,-45 -85,-38 -105,-20 C-108,-17 -110,-12 -110,-5 L-110,50 C-110,56 -105,62 -98,60 C-78,46 -42,42 -8,60 Z"
          fill="url(#cyanBlue)"
          stroke="#38BDF8"
          stroke-width="2" />
    
    <!-- Right Wing / Open Book Right Page -->
    <path d="M8,-25 C45,-45 85,-38 105,-20 C108,-17 110,-12 110,-5 L110,50 C110,56 105,62 98,60 C78,46 42,42 8,60 Z"
          fill="url(#emeraldGold)"
          stroke="#34D399"
          stroke-width="2" />

    <!-- Center Spine & Digital Stylized "E" Spine -->
    <path d="M-8,-35 L8,-35 L12,65 L0,74 L-12,65 Z" fill="#0F172A" stroke="url(#borderGrad)" stroke-width="2.5" />

    <!-- Stylized Modern 'E' Horizontal Ribs / Data Nodes -->
    <rect x="-42" y="-12" width="84" height="9" rx="4.5" fill="#FFFFFF" filter="url(#neonGlow)" />
    <rect x="-28" y="10" width="56" height="8" rx="4" fill="#00F5D4" />
    <rect x="-42" y="32" width="84" height="9" rx="4.5" fill="#10B981" />

    <!-- Central Knowledge Spark / Star -->
    <g transform="translate(0, 10)">
      <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="#FDE047" filter="url(#neonGlow)" />
      <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
    </g>
  </g>

  <!-- LAUREL WREATH OF EXCELLENCE (LOWER ACCENT) -->
  <g transform="translate(256, 395)" stroke="url(#goldAccent)" stroke-width="2.5" fill="none" stroke-linecap="round">
    <!-- Left Wreath Leaves -->
    <path d="M-25,12 C-55,10 -85,-10 -95,-40" />
    <path d="M-40,8 C-48,-2 -60,0 -58,10" fill="url(#goldAccent)" />
    <path d="M-65,0 C-75,-8 -86,-4 -82,6" fill="url(#goldAccent)" />
    <path d="M-85,-18 C-95,-24 -102,-18 -98,-8" fill="url(#goldAccent)" />
    
    <!-- Right Wreath Leaves -->
    <path d="M25,12 C55,10 85,-10 95,-40" />
    <path d="M40,8 C48,-2 60,0 58,10" fill="url(#goldAccent)" />
    <path d="M65,0 C75,-8 86,-4 82,6" fill="url(#goldAccent)" />
    <path d="M85,-18 C95,-24 102,-18 98,-8" fill="url(#goldAccent)" />

    <!-- Center Ribbon Badge -->
    <polygon points="0,5 -14,16 0,22 14,16" fill="url(#emeraldGold)" stroke="#34D399" stroke-width="1.5" />
    <circle cx="0" cy="14" r="3" fill="#FDE047" />
  </g>
</svg>